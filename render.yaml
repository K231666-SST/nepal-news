services:
  - type: web
    name: nepal-news-australia
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        fromService:
          type: web
          name: nepal-news-australia
          property: host
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: nepal-news-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nepal-news-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: nepal-news-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: nepal-news-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nepal-news-db
          property: password
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: file

databases:
  - name: nepal-news-db
    databaseName: nepal_news
    plan: free
